# Private video library at https://videos.yajur.ai
#   jellyfin    — streams videos from MEDIA_DIR, handles user login and per-library access
#   gateway     — serves /kodai1994/ (collection page) and proxies everything else to Jellyfin
#   cloudflared — publishes the gateway at https://videos.yajur.ai with no open ports
# Setup: see README.md in this folder.

services:
  jellyfin:
    image: jellyfin/jellyfin:12.2
    container_name: yajur-jellyfin
    user: "${PUID}:${PGID}"
    # Localhost only, for admin from this machine. Not 8096: a Tailscale Funnel path on
    # this host already forwards public traffic to 127.0.0.1:8096.
    ports:
      - "127.0.0.1:8099:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - "${MEDIA_DIR}:/media:ro"
    environment:
      - JELLYFIN_PublishedServerUrl=https://videos.yajur.ai
    restart: unless-stopped

  gateway:
    image: caddy:2.10.2-alpine
    container_name: yajur-videos-gateway
    ports:
      - "127.0.0.1:8098:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./kodai1994/site:/srv/kodai1994:ro
      # HLS output of kodai1994/package-hls.sh, plus the backdrop photo (members only)
      - "${MEDIA_DIR}/kodai1994-hls:/srv/kodai1994-hls:ro"
      # logo + favicon (public; kept out of the repository)
      - "${MEDIA_DIR}/kodai1994-brand:/srv/kodai1994-brand:ro"
      # face crops from the faceid worker (members only)
      - "${MEDIA_DIR}/kodai1994-identify:/srv/kodai1994-faces:ro"
    environment:
      # Jellyfin ItemId of the "Kodai 1994" library; HLS access is checked against it
      - KODAI_LIBRARY_ID=${KODAI_LIBRARY_ID}
    depends_on:
      - jellyfin
    restart: unless-stopped

  # Comments, display names, and access requests for the Kodai page (kodai1994/community/app.py).
  # Not published on the host; only the gateway reaches it.
  community:
    image: python:3.13.5-alpine
    container_name: yajur-kodai-community
    user: "${PUID}:${PGID}"
    command: python3 -I /app/app.py
    volumes:
      - ./kodai1994/community/app.py:/app/app.py:ro
      - ./community-data:/data
      # originals of photos members upload (kept; never served)
      - "${MEDIA_DIR}/kodai1994-uploads:/uploads"
    environment:
      - KODAI_LIBRARY_ID=${KODAI_LIBRARY_ID}
      - DATA_DIR=/data
      # Optional email (see .env.example): request notices to ADMIN_EMAIL, credentials to approved people
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
    depends_on:
      - jellyfin
    restart: unless-stopped

  # Media worker (kodai1994/faceid/worker.py): adds photos members upload, and runs the
  # face identification queue members fill from the Identify page, one run at a time.
  # CPU only, capped so videos keep playing smoothly while it works. Not on any network
  # anyone can reach: it only reads files and the community database.
  faceid:
    build: ./kodai1994/faceid
    image: yajur-kodai-faceid
    container_name: yajur-kodai-faceid
    # Started by deploy.sh only once FACEID_MODELS is set in .env.
    profiles: ["faceid"]
    user: "${PUID}:${PGID}"
    cpus: 4
    network_mode: none
    volumes:
      - ./community-data:/data
      # InsightFace buffalo_l: det_10g.onnx + w600k_r50.onnx (non-commercial licence; not in git)
      - "${FACEID_MODELS}:/models:ro"
      - "${MEDIA_DIR}/kodai1994-hls:/media/hls:ro"
      # uploaded photos are added here (photos.json + web copies); the rest stays read-only
      - "${MEDIA_DIR}/kodai1994-hls/photos:/media/hls/photos"
      - "${MEDIA_DIR}/kodai1994-uploads:/uploads"
      - "${MEDIA_DIR}/kodai1994:/media/videos:ro"
      - "${MEDIA_DIR}/kodai1994-identify:/out"
    environment:
      - DATA_DIR=/data
      - THREADS=4
    depends_on:
      - community
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    container_name: yajur-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - gateway
    restart: unless-stopped
