# Private video library at https://videos.yajur.ai
#   jellyfin    — streams videos from MEDIA_DIR, handles user login and per-library access
#   gateway     — serves /kodai1994/ (collection page) and proxies everything else to Jellyfin
#   cloudflared — publishes the gateway at https://videos.yajur.ai with no open ports
# Setup: see README.md in this folder.

services:
  jellyfin:
    image: jellyfin/jellyfin:12.2
    container_name: yajur-jellyfin
    user: "${PUID}:${PGID}"
    # Localhost only, for admin from this machine. Not 8096: a Tailscale Funnel path on
    # this host already forwards public traffic to 127.0.0.1:8096.
    ports:
      - "127.0.0.1:8099:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - "${MEDIA_DIR}:/media:ro"
    environment:
      - JELLYFIN_PublishedServerUrl=https://videos.yajur.ai
    restart: unless-stopped

  gateway:
    image: caddy:2.10.2-alpine
    container_name: yajur-videos-gateway
    ports:
      - "127.0.0.1:8098:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./kodai1994/site:/srv/kodai1994:ro
      # HLS output of kodai1994/package-hls.sh, plus the backdrop photo (members only)
      - "${MEDIA_DIR}/kodai1994-hls:/srv/kodai1994-hls:ro"
      # logo + favicon (public; kept out of the repository)
      - "${MEDIA_DIR}/kodai1994-brand:/srv/kodai1994-brand:ro"
    environment:
      # Jellyfin ItemId of the "Kodai 1994" library; HLS access is checked against it
      - KODAI_LIBRARY_ID=${KODAI_LIBRARY_ID}
    depends_on:
      - jellyfin
    restart: unless-stopped

  # Comments, display names, and access requests for the Kodai page (kodai1994/community/app.py).
  # Not published on the host; only the gateway reaches it.
  community:
    image: python:3.13.5-alpine
    container_name: yajur-kodai-community
    user: "${PUID}:${PGID}"
    command: python3 -I /app/app.py
    volumes:
      - ./kodai1994/community/app.py:/app/app.py:ro
      - ./community-data:/data
    environment:
      - KODAI_LIBRARY_ID=${KODAI_LIBRARY_ID}
      - DATA_DIR=/data
      # Optional email (see .env.example): request notices to ADMIN_EMAIL, credentials to approved people
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
    depends_on:
      - jellyfin
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    container_name: yajur-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - gateway
    restart: unless-stopped
